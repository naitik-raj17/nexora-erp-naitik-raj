name: CI

on:
  # Every pull request, including ones stacked on another feature branch.
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexora:nexora@localhost:5432/nexora?schema=public
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build
